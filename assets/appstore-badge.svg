<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40"
     role="img" aria-label="Download on the App Store">
  <!--
    appstore-badge.svg — кнопка «Download on the App Store». T-230.

    ── ПОЧЕМУ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ ВСТРОЕННЫЙ SVG ──────────────────────────
    Бейдж стоит на девяти страницах, местами по два раза. Встроенный SVG — это
    двадцать строк разметки в каждом месте: сайт распухает, а правка формы
    требует девяти одинаковых редактирований. Отдельный файл подключается одной
    строкой <img>, скачивается ОДИН раз и дальше берётся из кэша браузера.

    ── ПОЧЕМУ НЕ КАРТИНКА С СЕРВЕРОВ APPLE ─────────────────────────────────
    Apple раздаёт официальный бейдж по адресу вида
    https://tools.applemediaservices.com/…/black.svg. Ссылка на него — внешний
    запрос с каждой страницы, то есть чужой сервер узнаёт IP-адрес каждого,
    кто открыл сайт. Для приложения, которое обещает «no cross-app tracking»
    (T-394), это недопустимо, и сторож Scripts/landing-audit.sh (проверка D)
    на такой ссылке падает.

    ЗАМЕНА НА ОФИЦИАЛЬНЫЙ ФАЙЛ. Apple разрешает и предпочитает свою
    оригинальную графику. Скачать её можно на
    developer.apple.com/app-store/marketing/guidelines/ и положить сюда же
    вместо этого файла — пропорции 3:1 те же, правок в CSS и в разметке не
    потребуется. Порядок действий записан в LegalPages/README.md.

    ── ТЁМНАЯ ТЕМА ─────────────────────────────────────────────────────────
    SVG, подключённый через <img>, ВЫПОЛНЯЕТ собственные медиа-запросы и
    читает системную тему браузера. Поэтому бейдж сам переворачивается:
    чёрный на светлом фоне, белый на тёмном — ровно как две официальные
    версии Apple, но одним файлом.
  -->
  <!--
    ВНИМАНИЕ: цвета заданы ДВАЖДЫ — атрибутами fill/stroke прямо на фигурах и
    классами в <style>. Это не небрежность.

    Атрибут — базовое значение, которое понимает ЛЮБОЙ отрисовщик, включая
    урезанные (например, NSImage в macOS игнорирует CSS внутри SVG целиком —
    на этом файл уже один раз отрисовался чёрным по чёрному). Классы нужны
    только затем, чтобы медиа-запрос ниже мог переопределить цвета в тёмной
    теме. Если CSS не выполнится, останутся атрибуты, и бейдж будет просто
    всегда чёрным — рабочий вариант, а не пустой прямоугольник.
  -->
  <style>
    .plate  { fill: #000000; }
    .edge   { stroke: #a6a6a6; }
    .label  { fill: #ffffff; }

    @media (prefers-color-scheme: dark) {
      .plate { fill: #ffffff; }
      .edge  { stroke: #3a3a3c; }
      .label { fill: #000000; }
    }

    /* Шрифт системный: тот же, что у остального сайта. Загружать нечего,
       и на iPhone надпись выглядит ровно как на настоящем бейдже. */
    .t {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Подложка. Отступ 0.5 по краям нужен, чтобы обводка толщиной 1
       поместилась внутри viewBox и не обрезалась вдвое. -->
  <rect class="plate edge" x="0.5" y="0.5" width="119" height="39" rx="8.5"
        fill="#000000" stroke="#a6a6a6" stroke-width="1" />

  <!-- Логотип Apple. Путь нарисован в системе координат 24×24 и перенесён
       трансформацией: так его проще заменить или отмасштабировать, не
       пересчитывая каждое число в самом пути. -->
  <g class="label" fill="#ffffff" transform="translate(9.5 7.6) scale(0.86)">
    <path d="M17.05 12.04c-.03-2.9 2.37-4.3 2.48-4.36-1.35-1.98-3.46-2.25-4.21-2.28-1.79-.18-3.5 1.05-4.41 1.05-.91 0-2.31-1.03-3.8-1-.2 0-3.77.05-5.6 3.34-1.9 3.4-.48 8.44 1.37 11.2.9 1.35 1.98 2.87 3.4 2.81 1.36-.05 1.88-.88 3.53-.88 1.65 0 2.11.88 3.55.85 1.47-.02 2.4-1.38 3.3-2.73 1.04-1.56 1.47-3.08 1.5-3.16-.03-.01-2.88-1.1-2.91-4.37z" />
    <path d="M14.2 4.2c.75-.9 1.25-2.16 1.11-3.41-1.08.04-2.38.72-3.15 1.62-.69.8-1.3 2.08-1.14 3.3 1.2.1 2.43-.61 3.18-1.51z" />
  </g>

  <!-- Две строки надписи. Верхняя мелкая и разрежённая, нижняя крупная —
       пропорции взяты с официального бейджа. -->
  <text class="t label" fill="#ffffff" x="34" y="16.4" font-size="7.6" letter-spacing="0.35">Download on the</text>
  <text class="t label" fill="#ffffff" x="33.4" y="31" font-size="15.6" font-weight="600" letter-spacing="-0.4">App Store</text>
</svg>
