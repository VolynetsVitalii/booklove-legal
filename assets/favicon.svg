<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BooksLove">
  <!--
    favicon.svg — значок вкладки браузера. T-230.

    Почему SVG, а не .ico или .png:
      • один файл на все размеры (16, 32, 180, 512) — вектор не размывается;
      • весит около 700 байт против 15–20 КБ у набора PNG;
      • умеет менять цвет под тёмную тему браузера (см. <style> ниже),
        чего растровый значок не умеет в принципе.

    Рисунок — упрощённая иконка приложения: кремовая книга с корешком и
    розовым сердцем на синем скруглённом квадрате. На 16×16 пикселях мелкие
    детали иконки (тиснение, полоски корешка, надпись «EST. 2023») слились бы
    в кашу, поэтому здесь оставлены только три читаемые формы.
  -->
  <style>
    /* Цвета фона слегка светлеют в тёмной теме браузера: на тёмной панели
       вкладок глубокий #0E2C5C сливается с фоном и значок пропадает. */
    .bg { fill: #0e2c5c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c4a8f; }
    }
  </style>

  <!-- Подложка: скруглённый квадрат во всю площадь. -->
  <rect class="bg" width="64" height="64" rx="14" />

  <!-- Блок книги: кремовый прямоугольник со скруглением. -->
  <rect x="14" y="12" width="36" height="40" rx="5" fill="#f4f0e4" />

  <!-- Корешок: полоса чуть темнее блока, отделённая тонкой линией. -->
  <rect x="14" y="12" width="9" height="40" rx="5" fill="#e2dbc6" />
  <rect x="22" y="12" width="1.5" height="40" fill="#d3cab2" />

  <!--
    Сердце. Центр по X — 37: это середина СТРАНИЦЫ книги (23,5…50), а не
    середина всего значка. Если центрировать по значку, сердце наползёт
    на корешок.

    Контур читается по командам:
      M37 40  — начинаем в нижнем острие;
      c …     — левый бок вверх, к началу левой доли (27; 28,1);
      a 5.2 … — левая доля дугой радиуса 5,2 до верхней впадины (37; 25,9);
      a 5.2 … — правая доля до (47; 28,1);
      c …     — правый бок вниз, обратно в острие;
      z       — замкнуть.

    Хорда каждой дуги (10,24) чуть короче диаметра (10,4) — обязательное
    условие: при хорде длиннее диаметра браузер молча увеличивает радиус,
    и доли становятся плоскими.
  -->
  <path d="M37 40c-1.2-1.1-10-6.9-10-11.9a5.2 5.2 0 0 1 10-2.2 5.2 5.2 0 0 1 10 2.2c0 5-8.8 10.8-10 11.9z"
        fill="#e8607f" />
</svg>
